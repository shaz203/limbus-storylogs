
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limbus Story Reader</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101114;
      color: #f5f0e8;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #191b20;
      border-bottom: 1px solid #45413a;
    }

    a { color: #e5c88f; text-decoration: none; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
    }

    #stage {
      position: relative;
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: #252525 center / cover no-repeat;
      border: 1px solid #6e5b3e;
      overflow: hidden;
    }

    #stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 25%,
        rgba(0,0,0,.85) 100%
      );
      pointer-events: none;
    }

    .background-layers {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.background-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
}

#dialogue {
    position: relative;
    padding: 18px 24px;
    min-height: 125px;
    background: rgba(10, 11, 14, 0.88);
    border-top: 1px solid #c6a76b;
    z-index: 2;
}

    #speaker {
      color: #e5c88f;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 16px;
    }

   #text {
    font-size: clamp(15px, 1.8vw, 20px);
    line-height: 1.45;
    white-space: pre-wrap;
}

    #location {
      color: #bbb2a3;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      padding: 12px 20px;
      border: 1px solid #8c754e;
      background: #24262b;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #393b40; }
    button:disabled { opacity: .35; cursor: not-allowed; }

    #counter { color: #bbb2a3; align-self: center; }

    #error { color: #ff9292; white-space: pre-wrap; }

    @media (max-width: 600px) {
      #stage { min-height: 70vh; }
      #dialogue { padding: 20px; }
      header { padding: 14px; }
    }

    
/* Character sprites */
.sprite {
    position: absolute;
    bottom: 155px;
    height: 65%;
    max-width: 45%;
    width: auto;
    object-fit: contain;
    object-position: bottom center;
    z-index: 1;
    pointer-events: none;
}

.sprite.left {
  left: 2%;
}

.sprite.center {
  left: 50%;
  transform: translateX(-50%);
}

.sprite.right {
  right: 2%;
}

.sprite.hidden {
  display: none;
}

  </style>
</head>

<body>
  <header>
    <a href="index.html">← Chapter Library</a>
    <span id="chapterLabel">Loading story…</span>
  </header>

  <main>
    <h1 id="title">Loading…</h1>
    <p id="error"></p>

    <section id="stage">
      <div id="backgroundLayers" class="background-layers"
     aria-hidden="true"></div>
        <!-- Character sprites -->
  <img id="spriteLeft" class="sprite left hidden" alt="">
  <img id="spriteCenter" class="sprite center hidden" alt="">
  <img id="spriteRight" class="sprite right hidden" alt="">
      <div id="dialogue">
        <div id="location"></div>
        <div id="speaker"></div>
        <div id="text">Loading dialogue…</div>
      </div>
    </section>

   <div class="controls">
  <button id="previous">← Previous</button>
  <span id="counter">Scene 0 / 0</span>
  <button id="next">Next →</button>
  <button id="saveProgress">Save</button>
  <button id="loadProgress">Load</button>
</div>
  </main>

  
<script>
  const params = new URLSearchParams(location.search);
  const chapter = params.get("chapter") || "prologue";
  const SAVE_KEY = "limbusReaderProgress";

  let story;
  let sceneIndex = 0;

  const $ = id => document.getElementById(id);

  async function loadStory() {
    try {
      const response = await fetch(
        `./chapterjson/${encodeURIComponent(chapter)}.json`
      );

      if (!response.ok) {
        throw new Error(
          `Could not load chapter JSON (${response.status}).`
        );
      }

      story = await response.json();

      if (!Array.isArray(story.scenes) || story.scenes.length === 0) {
        throw new Error("This JSON file has no scenes.");
      }

      $("title").textContent = story.title || chapter;
      $("chapterLabel").textContent =
        story.chapterLabel || "Story Reader";

      showScene();
    } catch (error) {
      $("error").textContent =
        error.message +
        "\nCheck the JSON path and run this site through a local web server.";
      $("text").textContent = "";
    }
  }

  function showScene() {
    if (!story || !story.scenes[sceneIndex]) return;

    const scene = story.scenes[sceneIndex];

    $("location").textContent = scene.location || "";
    $("speaker").textContent = scene.speaker || "";
    $("text").textContent = scene.text || "";

    $("stage").style.backgroundImage = scene.background
      ? `url("${scene.background}")`
      : "none";
renderBackgroundLayers(scene.backgroundLayers);

    setSprite("spriteLeft", scene.left, scene.spriteAdjust?.left);
setSprite("spriteCenter", scene.center, scene.spriteAdjust?.center);
setSprite("spriteRight", scene.right, scene.spriteAdjust?.right);

    $("counter").textContent =
      `Scene ${sceneIndex + 1} / ${story.scenes.length}`;

    $("previous").disabled = sceneIndex === 0;

    $("next").textContent =
      sceneIndex === story.scenes.length - 1
        ? "End of chapter"
        : "Next →";

          $("next").textContent =
    sceneIndex === story.scenes.length - 1
      ? "End of chapter"
      : "Next →";
}
function renderBackgroundLayers(layers = []) {
    const container = $("backgroundLayers");

    // Remove the previous scene's layers.
    container.replaceChildren();

    if (!Array.isArray(layers)) return;

    layers.forEach(layer => {
        // Allow either a plain image path or an object.
        const settings = typeof layer === "string"
            ? { src: layer }
            : layer;

        if (!settings || !settings.src) return;

        const img = document.createElement("img");
        img.className = "background-layer";
        img.src = settings.src;
        img.alt = "";

        img.style.opacity = settings.opacity ?? 1;
        img.style.objectFit = settings.fit ?? "cover";

        const x = settings.x ?? 0;
        const y = settings.y ?? 0;
        const scale = settings.scale ?? 1;

        img.style.transform =
            `translate(${x}px, ${-y}px) scale(${scale})`;

        container.appendChild(img);
    });
}
function setSprite(id, src, settings = {}) {
    const el = $(id);

    if (!src) {
        el.removeAttribute("src");
        el.classList.add("hidden");
        el.style.transform = "";
        return;
    }

    el.src = src;
    el.classList.remove("hidden");

    const scale = settings.scale ?? 1;
    const x = settings.x ?? 0;
    const y = settings.y ?? 0;

    const baseTransform =
        id === "spriteCenter" ? "translateX(-50%) " : "";

    el.style.transform =
        `${baseTransform}translate(${x}px, ${-y}px) scale(${scale})`;
}
 

  // Previous scene
  $("previous").addEventListener("click", () => {
    if (sceneIndex > 0) {
      sceneIndex--;
      showScene();
    }
  });

  // Next scene
  $("next").addEventListener("click", () => {
    if (sceneIndex < story.scenes.length - 1) {
      sceneIndex++;
      showScene();
    }
  });

  // Save current chapter and scene
  $("saveProgress").addEventListener("click", () => {
    if (!story) {
      alert("The story has not loaded yet.");
      return;
    }

    const saveData = {
      chapter: chapter,
      sceneIndex: sceneIndex
    };

    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
      alert("Progress saved!");
    } catch (error) {
      alert("Could not save progress.");
      console.error(error);
    }
  });

  // Load saved chapter and scene
  $("loadProgress").addEventListener("click", () => {
    if (!story) {
      alert("The story has not loaded yet.");
      return;
    }

    try {
      const saved = localStorage.getItem(SAVE_KEY);

      if (!saved) {
        alert("No saved progress found.");
        return;
      }

      const saveData = JSON.parse(saved);

      if (saveData.chapter !== chapter) {
        alert("This save belongs to another chapter.");
        return;
      }

      if (
        !Number.isInteger(saveData.sceneIndex) ||
        saveData.sceneIndex < 0 ||
        saveData.sceneIndex >= story.scenes.length
      ) {
        alert("The saved scene is invalid.");
        return;
      }

      sceneIndex = saveData.sceneIndex;
      showScene();

      alert("Progress loaded!");
    } catch (error) {
      alert("Could not load progress.");
      console.error(error);
    }
  });

  // Keyboard navigation
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") $("next").click();
    if (event.key === "ArrowLeft") $("previous").click();
  });

  loadStory();
</script>

</body>
</html>
